<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NICA — Noida Intercollege Cricket Association</title>

    <meta
        name="description"
        content="NICA Cricket Association — live cricket, matches, teams, players, rankings and records."
    >

    <meta name="theme-color" content="#079b79">

    <link rel="stylesheet" href="/style.css">

    <style>
        .brand-box {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .admin-nav {
            color: #a35b00 !important;
        }

        .admin-nav::before {
            content: "🔒 ";
        }

        .desktop-nav {
            display: flex;
            align-items: center;
            gap: 2px;
            flex: 1;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .desktop-nav::-webkit-scrollbar {
            display: none;
        }

        .desktop-nav button {
            white-space: nowrap;
        }

        .drawer {
            z-index: 100;
        }

        #overlay {
            z-index: 90;
        }

        #app {
            min-height: calc(100vh - 110px);
        }

        @media (max-width: 800px) {
            .topbar {
                padding: 0 10px;
                gap: 8px;
            }

            .desktop-nav {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- Top navigation -->
    <header class="topbar">

        <button
            type="button"
            class="brand"
            onclick="navigate('home')"
            aria-label="NICA Home"
        >
            <span class="brand-box">
                <span>
                    <strong>NICA</strong>
                    <br>
                    <small>
                        NOIDA INTERCOLLEGE CRICKET ASSOCIATION
                    </small>
                </span>
            </span>
        </button>

        <!-- Desktop navigation -->
        <nav
            class="desktop-nav"
            aria-label="Main navigation"
        >
            <button type="button" data-view="home">
                Home
            </button>

            <button type="button" data-view="live">
                Live
            </button>

            <button type="button" data-view="matches">
                Matches
            </button>

            <button type="button" data-view="teams">
                Teams
            </button>

            <button type="button" data-view="players">
                Players
            </button>

            <button type="button" data-view="rankings">
                Rankings
            </button>

            <button type="button" data-view="pointTable">
                Points Table
            </button>

            <button type="button" data-view="records">
                Records
            </button>

            <button type="button" data-view="stats">
                Statistics
            </button>
        </nav>

        <!-- Mobile menu button -->
        <button
            id="menuBtn"
            class="menu-btn"
            type="button"
            aria-label="Open NICA menu"
            aria-controls="drawer"
            aria-expanded="false"
        >
            ☰ Menu
        </button>

    </header>

    <!-- Drawer overlay -->
    <div
        id="overlay"
        aria-hidden="true"
    ></div>

    <!-- Side menu -->
    <aside
        id="drawer"
        class="drawer"
        aria-label="NICA Menu"
    >
        <div class="drawer-head">
            <strong>NICA Menu</strong>

            <button
                id="closeMenu"
                type="button"
                aria-label="Close menu"
            >
                ×
            </button>
        </div>

        <button type="button" data-view="home">
            🏠 Home
        </button>

        <button type="button" data-view="live">
            🔴 Live
        </button>

        <button type="button" data-view="matches">
            📋 Matches
        </button>

        <button type="button" data-view="teams">
            🏏 Teams
        </button>

        <button type="button" data-view="players">
            👤 Players
        </button>

        <button type="button" data-view="pointTable">
            📊 Points Table
        </button>

        <button type="button" data-view="records">
            🏆 Records
        </button>

        <button type="button" data-view="stats">
            📊 Statistics
        </button>

        <button type="button" data-view="headToHead">
            ⚔️ Head to Head
        </button>

        <button type="button" data-view="careerRecords">
            🏆 Career Records
        </button>

        <button type="button" data-view="batRankings">
            🏏 Batting Rankings
        </button>

        <button type="button" data-view="bowlRankings">
            🎯 Bowling Rankings
        </button>

        <button type="button" data-view="allRoundRankings">
            ⭐ All-round Rankings
        </button>

        <button type="button" data-view="catchRecords">
            🧤 Catch Records
        </button>

        <button type="button" data-view="centuryRecords">
            💯 Most Centuries
        </button>

        <button type="button" data-view="fiftyRecords">
            5️⃣ Most 50+ Scores
        </button>

        <button type="button" data-view="sixRecords">
            6️⃣ Most Sixes
        </button>

        <button type="button" data-view="fourRecords">
            4️⃣ Most Fours
        </button>

        <button type="button" data-view="wicketRecords">
            🎯 Most Wickets
        </button>

        <button
            type="button"
            class="admin-nav"
            data-view="admin"
        >
            Admin Panel
        </button>
    </aside>

    <!-- Application root -->
    <main id="app">
        <div class="card empty">
            Loading NICA Cricket Association...
        </div>
    </main>

    <!-- Footer -->
    <footer
        style="
            text-align: center;
            padding: 20px;
            color: #667085;
            font-size: 12px;
        "
    >
        NICA — Noida Intercollege Cricket Association
        <br>
        Live Cricket · Players · Rankings · Records
    </footer>

    <!-- Load the corrected app.js -->
    <script src="/app.js?v=20260911-2132"></script>

    <noscript>
        <div
            style="
                padding: 20px;
                text-align: center;
                color: #b42318;
                font-weight: 700;
            "
        >
            JavaScript is required to run NICA Cricket Association.
        </div>
    </noscript>

</body>
</html>
